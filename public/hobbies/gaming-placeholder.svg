<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="gamingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d0c" />
      <stop offset="100%" stop-color="#111715" />
    </linearGradient>
    <radialGradient id="gamingGlowVal" cx="22%" cy="45%" r="36%">
      <stop offset="0%" stop-color="#ff4655" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ff4655" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gamingGlowLol" cx="34%" cy="58%" r="34%">
      <stop offset="0%" stop-color="#c89b3c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#c89b3c" stop-opacity="0" />
    </radialGradient>
    <pattern id="gamingGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1d2823" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#gamingBg)" />
  <rect width="800" height="360" rx="16" fill="url(#gamingGrid)" />
  <rect width="800" height="360" rx="16" fill="url(#gamingGlowVal)" />
  <rect width="800" height="360" rx="16" fill="url(#gamingGlowLol)" />
  <rect x="2" y="2" width="796" height="356" rx="14" fill="none" stroke="#00ff88" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Tactical Crosshair & Dual Profile Emblem (Left) -->
  <g transform="translate(86, 72)">
    <!-- Outer reticle -->
    <circle cx="104" cy="108" r="76" fill="#0d1311" fill-opacity="0.85" stroke="#26352e" stroke-width="1.5" />
    <circle cx="104" cy="108" r="56" fill="none" stroke="#ff4655" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="18 10" />
    <circle cx="104" cy="108" r="34" fill="none" stroke="#c89b3c" stroke-opacity="0.65" stroke-width="1.8" />

    <!-- Crosshair ticks -->
    <line x1="104" y1="20" x2="104" y2="44" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" />
    <line x1="104" y1="172" x2="104" y2="196" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" />
    <line x1="16" y1="108" x2="40" y2="108" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" />
    <line x1="168" y1="108" x2="192" y2="108" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="104" cy="108" r="5" fill="#00ff88" />

    <!-- Dual game accent badges -->
    <g transform="translate(24, 186)">
      <rect x="0" y="0" width="74" height="22" rx="6" fill="#171014" stroke="#ff4655" stroke-opacity="0.6" stroke-width="1" />
      <rect x="7" y="7" width="8" height="8" rx="2" fill="#ff4655" />
      <text x="21" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#ffd6da">VAL</text>

      <rect x="86" y="0" width="74" height="22" rx="6" fill="#16140d" stroke="#c89b3c" stroke-opacity="0.6" stroke-width="1" />
      <rect x="93" y="7" width="8" height="8" rx="2" fill="#c89b3c" />
      <text x="107" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f3dfb0">LOL</text>
    </g>
  </g>

  <!-- Right Copy Block -->
  <g transform="translate(316, 86)">
    <rect x="0" y="0" width="236" height="28" rx="14" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#00ff88" />
    <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00ff88" letter-spacing="1.2">
      LOCAL PHOTO PLACEHOLDER
    </text>

    <text x="0" y="66" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#f3f7f5" letter-spacing="0.4">
      VALORANT &amp; LEAGUE
    </text>
    <text x="0" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#d2e4dc" letter-spacing="0.4">
      PROFILE
    </text>

    <rect x="0" y="122" width="420" height="40" rx="10" fill="#0b0f0d" stroke="#23302a" stroke-width="1" />
    <text x="16" y="147" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#9fb2a8">
      Replace with <tspan fill="#00ff88" font-weight="600">/hobbies/gaming.png</tspan>
    </text>
  </g>
</svg>

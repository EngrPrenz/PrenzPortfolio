<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="motoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d0c" />
      <stop offset="100%" stop-color="#111715" />
    </linearGradient>
    <radialGradient id="motoGlow" cx="25%" cy="55%" r="44%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>
    <pattern id="motoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1d2823" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#motoBg)" />
  <rect width="800" height="360" rx="16" fill="url(#motoGrid)" />
  <rect width="800" height="360" rx="16" fill="url(#motoGlow)" />
  <rect x="2" y="2" width="796" height="356" rx="14" fill="none" stroke="#00ff88" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Stylized Mountain & Winding Route Graphic (Left) -->
  <g transform="translate(66, 72)">
    <rect x="0" y="0" width="224" height="216" rx="16" fill="#0d1311" stroke="#22312a" stroke-width="1.5" />

    <!-- Horizon sun/moon -->
    <circle cx="164" cy="54" r="20" fill="#00ff88" fill-opacity="0.16" stroke="#00ff88" stroke-opacity="0.45" stroke-width="1.2" />

    <!-- Back mountain ridge -->
    <path d="M 14 148 L 66 72 L 108 124 L 150 64 L 210 148 Z" fill="#15201c" stroke="#283d34" stroke-width="1.2" />
    <!-- Front ridge -->
    <path d="M 14 156 L 54 108 L 96 144 L 146 98 L 210 156 Z" fill="#111a17" />

    <!-- Winding road surface -->
    <path d="M 122 146 C 98 156, 148 172, 108 188 C 80 198, 54 206, 42 214 L 182 214 C 154 202, 134 192, 144 178 C 154 164, 128 156, 130 146 Z" fill="#090d0c" stroke="#00ff88" stroke-opacity="0.55" stroke-width="1.5" />
    <!-- Neon route curve -->
    <path d="M 126 148 C 110 158, 142 172, 120 186 C 102 198, 86 206, 82 212" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" />

    <!-- Destination pin -->
    <circle cx="126" cy="144" r="4.5" fill="#00ff88" />
  </g>

  <!-- Right Copy Block -->
  <g transform="translate(316, 86)">
    <rect x="0" y="0" width="236" height="28" rx="14" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#00ff88" />
    <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00ff88" letter-spacing="1.2">
      LOCAL PHOTO PLACEHOLDER
    </text>

    <text x="0" y="66" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#f3f7f5" letter-spacing="0.4">
      MOTORCYCLE
    </text>
    <text x="0" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#d2e4dc" letter-spacing="0.4">
      ROAD TRIPS
    </text>

    <rect x="0" y="122" width="420" height="40" rx="10" fill="#0b0f0d" stroke="#23302a" stroke-width="1" />
    <text x="16" y="147" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#9fb2a8">
      Replace with <tspan fill="#00ff88" font-weight="600">/hobbies/motorcycle.jpg</tspan>
    </text>
  </g>
</svg>

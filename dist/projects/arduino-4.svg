      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>
    <linearGradient id="cardGrad_4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2b" />
      <stop offset="100%" stop-color="#101520" />
    </linearGradient>
    <filter id="glow_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" rx="16" fill="url(#bgGrad_4)" />
  <rect width="1196" height="746" x="2" y="2" rx="15" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="2" />

